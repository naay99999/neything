version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ney
    main: ./cmd/ney
    binary: ney
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ney
    name_template: "ney_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

checksum:
  name_template: "ney_{{.Version}}_checksums.txt"

release:
  github:
    owner: naay99999
    name: neything
  draft: false
  prerelease: auto
