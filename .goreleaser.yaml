version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ney
    main: ./cmd/ney
    binary: ney
    ldflags:
      - -s -w -X main.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: ney
    name_template: "ney_{{.Version}}_{{.Os}}_{{.Arch}}"
    formats:
      - tar.gz
    files:
      - README.md

checksum:
  name_template: "ney_{{.Version}}_checksums.txt"

# Casks are macOS-only; Linux users install via scripts/install.sh or go install.
homebrew_casks:
  - name: ney
    repository:
      owner: naay99999
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    skip_upload: auto   # don't overwrite the cask from prerelease tags
    commit_msg_template: "ney {{ .Tag }}"
    homepage: "https://github.com/naay99999/neything"
    description: "Local-first CLI knowledge engine — index files, search by meaning, ask questions with source citations"
    hooks:
      post:
        # Go binaries are not notarized; strip the quarantine bit so
        # Gatekeeper doesn't block the first run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ney"]
          end

release:
  github:
    owner: naay99999
    name: neything
  draft: false
  prerelease: auto
