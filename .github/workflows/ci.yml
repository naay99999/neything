name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os != 'Windows' # CRLF checkouts make gofmt noisy on Windows
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...
      - run: go test ./...

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install.sh syntax
        run: sh -n scripts/install.sh && bash -n scripts/install.sh

  # install.ps1 against a locally served fake release, on Windows PowerShell
  # 5.1 and PowerShell 7.
  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Parse check
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Build fake release
        shell: pwsh
        run: |
          New-Item -ItemType Directory rel | Out-Null
          go build -o ney.exe ./cmd/ney
          Compress-Archive ney.exe rel/ney_0.0.0-ci_windows_amd64.zip
          $h = (Get-FileHash rel/ney_0.0.0-ci_windows_amd64.zip).Hash.ToLower()
          "$h  ney_0.0.0-ci_windows_amd64.zip" | Set-Content rel/ney_0.0.0-ci_checksums.txt
          Start-Process python -ArgumentList '-m','http.server','8765','--directory','rel' -WindowStyle Hidden
          Start-Sleep -Seconds 2

      - name: Install (Windows PowerShell 5.1), then update (PowerShell 7)
        shell: pwsh
        env:
          NEY_VERSION: v0.0.0-ci
          NEY_BASE_URL: http://127.0.0.1:8765
          NEY_NO_INIT: "1"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1
          if ($LASTEXITCODE) { exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\ney\ney.exe'
          & $exe version; if ($LASTEXITCODE) { exit 1 }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*Programs\ney*") { Write-Error "user PATH not updated: $userPath"; exit 1 }
          # second run = update; must not duplicate the PATH entry
          Get-Content scripts/install.ps1 -Raw | Invoke-Expression
          $count = @(([Environment]::GetEnvironmentVariable('Path', 'User')) -split ';' | Where-Object { $_ -like "*Programs\ney" }).Count
          if ($count -ne 1) { Write-Error "PATH entry count = $count"; exit 1 }

      - name: Bad checksum is refused
        shell: pwsh
        env:
          NEY_VERSION: v0.0.0-ci
          NEY_BASE_URL: http://127.0.0.1:8765
          NEY_NO_INIT: "1"
          NEY_INSTALL_DIR: ${{ runner.temp }}\ney-bad
        run: |
          "0000  ney_0.0.0-ci_windows_amd64.zip" | Set-Content rel/ney_0.0.0-ci_checksums.txt
          try { Get-Content scripts/install.ps1 -Raw | Invoke-Expression; Write-Error 'installed despite bad checksum'; exit 1 }
          catch { if ("$_" -notlike '*CHECKSUM MISMATCH*') { throw } }
          if (Test-Path "$env:NEY_INSTALL_DIR\ney.exe") { Write-Error 'binary written'; exit 1 }
